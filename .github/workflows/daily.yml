name: Daily Option Wall

on:
  schedule:
    # 매일 한국시간 아침 6:30 = UTC 21:30 (전날)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run main.py
        run: python main.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ summary.md
          git commit -m "Daily update $(date +'%Y-%m-%d')" || echo "No changes"
          git push

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          with open('summary.md', 'r', encoding='utf-8') as f:
              text = f.read()
          # 텔레그램은 한 번에 4096자까지만 보내져서 자름
          # 앞부분(예측 + OI 급증)만 먼저 보냄
          header = '📊 오늘 옵션월 리포트\n\n'
          # 예측 부분만 잘라서 보내기 - 너무 길면 앞 3500자만
          msg = header + text[:3500]
          # 두 번 나눠서 보내면 전체 다 볼 수 있음
          for i, chunk in enumerate([msg, text[3500:7000]]):
              if not chunk.strip():
                  continue
              r = requests.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  json={'chat_id': chat_id, 'text': chunk, 'parse_mode': 'Markdown'}
              )
              print(f'Telegram send {i}:', r.status_code)
          "
