name: Daily Option Wall
on:
  schedule:
    - cron: '30 21 * * 1-5'  # 미국 장 마감 후 (한국시간 평일 오전 6:30)
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run option script
        run: python main.py
      - name: Save results
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "option-bot"
          git add data/ summary.md
          git commit -m "daily option data" || echo "no change"
          git push
